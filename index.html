<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="PKVIEW - Stream movies, TV shows, anime, Bollywood, Nepali films, and live sports for free." />
    <meta name="theme-color" content="#22254b" />
    <meta property="og:title" content="PKVIEW" />
    <meta property="og:description" content="Free streaming for movies, TV shows, anime, Bollywood, Nepali films, drama, and live sports." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://image.tmdb.org/t/p/w500/1423966.jpg" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎬</text></svg>" />
    <link rel="stylesheet" href="style.css" />
    <title>PKVIEW - Free Movie & TV Streaming</title>
  </head>

  <body>
    <!-- Loading Spinner -->
    <div class="spinner-overlay" id="loadingSpinner">
      <div class="spinner"></div>
    </div>
    <header class="header_gsap">
      <div class="container">
        <div class="row">
          <div class="flex-container">
            <a href="index.html">
                <h2 class="animate-charcter larger-text text-effect">PKVIEW</h2>
            </a>
        </div>
        </div>
      </div>

      <form id="form">
        <input type="text" id="search" class="search" placeholder="Search" />
      </form>
      <div class="header-controls">
        <div class="pageChange">
          <svg
            class="switch icon icon-tabler icon-tabler-device-desktop"
            xmlns="http://www.w3.org/2000/svg"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="#7378c5"
            fill="none"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path stroke="none" d="M0 0h24v24H0z" fill="none"></path>
            <path
              d="M3 4m0 1a1 1 0 0 1 1 -1h16a1 1 0 0 1 1 1v10a1 1 0 0 1 -1 1h-16a1 1 0 0 1 -1 -1z"
            ></path>
            <path d="M7 20l10 0"></path>
            <path d="M9 16l0 4"></path>
            <path d="M15 16l0 4"></path>
          </svg>
        </div>
        <button class="theme-toggle" id="themeToggle" title="Toggle theme">
          <svg class="sun-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"></circle>
            <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
          </svg>
          <svg class="moon-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
      </div>
    </header>

    <nav class="main-nav">
      <a href="#" class="nav-link active" data-section="home">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>Home</span>
      </a>
      <a href="#" class="nav-link" data-section="bollywood">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="2" y1="12" x2="22" y2="12"></line>
          <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
        </svg>
        <span>Bollywood</span>
      </a>
      <a href="#" class="nav-link" data-section="anime">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polygon points="23 7 16 12 23 17 23 7"></polygon>
          <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
        </svg>
        <span>Anime</span>
      </a>
      <a href="#" class="nav-link" data-section="nepali">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path>
          <line x1="4" y1="22" x2="4" y2="15"></line>
        </svg>
        <span>Nepali</span>
      </a>
      <a href="#" class="nav-link" data-section="korean">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
        </svg>
        <span>Korean</span>
      </a>
      <a href="#" class="nav-link" data-section="webseries">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
          <line x1="8" y1="21" x2="16" y2="21"></line>
          <line x1="12" y1="17" x2="12" y2="21"></line>
        </svg>
        <span>Web Series</span>
      </a>
      <a href="#" class="nav-link" data-section="docs">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
        <span>Documentaries</span>
      </a>
      <a href="#" class="nav-link" data-section="sports">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"></path>
          <path d="M2 12h20"></path>
          <path d="M12 2c2.5 3.5 4 7.5 4 10s-1.5 6.5-4 10"></path>
          <path d="M12 2c-2.5 3.5-4 7.5-4 10s1.5 6.5 4 10"></path>
        </svg>
        <span>Sports</span>
      </a>
    </nav>

    <div class="scrollable-tabs-container">
      <div class="left-arrow">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="w-6 h-6"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M15.75 19.5L8.25 12l7.5-7.5"
          />
        </svg>
      </div>

      <div id="tags"></div>

      <div class="right-arrow active">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="w-6 h-6"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M8.25 4.5l7.5 7.5-7.5 7.5"
          />
        </svg>
      </div>
    </div>

    <div id="streamModal" class="stream-modal">
      <div class="stream-modal-content">
        <div class="stream-header">
          <h3 id="streamTitle">Movie Title</h3>
          <div class="stream-controls">
            <select id="languageSelect" class="lang-select">
              <option value="en">English</option>
              <option value="es">Spanish</option>
              <option value="fr">French</option>
              <option value="de">German</option>
              <option value="it">Italian</option>
              <option value="pt">Portuguese</option>
              <option value="ja">Japanese</option>
              <option value="ko">Korean</option>
              <option value="zh">Chinese</option>
              <option value="hi">Hindi</option>
              <option value="ar">Arabic</option>
              <option value="ru">Russian</option>
            </select>
            <button class="close-stream" onclick="closeStream()">&times;</button>
          </div>
        </div>
        <div class="server-tabs">
          <button class="server-tab active" data-server="0">VidNest</button>
          <button class="server-tab" data-server="1">EmbedMaster</button>
          <button class="server-tab" data-server="2">YapGrid</button>
          <button class="server-tab" data-server="3">VidLink</button>
          <button class="server-tab" data-server="4">VidPhantom</button>
          <button class="server-tab" data-server="5">2Embed</button>
          <button class="server-tab" data-server="6">MultiEmbed</button>
          <button class="server-tab" data-server="7">VidSrc</button>
          <button class="server-tab" data-server="8">Embed.su</button>
        </div>
        <div class="server-tabs anime-server-tabs" id="animeServerTabs" style="display:none;">
          <button class="anime-server-tab active" onclick="switchAnimeServer(0)">Megavid</button>
          <button class="anime-server-tab" onclick="switchAnimeServer(1)">MegaPlay</button>
          <button class="anime-server-tab" onclick="switchAnimeServer(2)">VidPlus</button>
          <button class="anime-server-tab" onclick="switchAnimeServer(3)">Open on Miruro</button>
        </div>
        <div class="season-select-container" id="seasonSelectContainer" style="display:none;">
          <div class="season-selector">
            <label for="seasonSelect">Season:</label>
            <select id="seasonSelect" class="lang-select"></select>
            <label for="episodeSelect">Episode:</label>
            <select id="episodeSelect" class="lang-select"></select>
          </div>
        </div>
        <div class="stream-player">
          <iframe id="streamFrame" src="" frameborder="0" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
          <div class="server-error" id="serverError" style="display:none;">
            <p>⚠️ This server is currently unavailable. Please try another server.</p>
          </div>
        </div>
        <div class="trailer-section">
          <button class="trailer-btn" id="trailerBtn" onclick="toggleTrailer()">Watch Trailer</button>
        </div>
        <div class="trailer-player" id="trailerPlayer" style="display:none;">
          <iframe id="trailerFrame" src="" frameborder="0" allowfullscreen allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
        </div>
      </div>
    </div>

    <!-- Season/Episode Selector Modal for TV Shows -->
    <div id="seasonModal" class="season-modal">
      <div class="season-modal-content">
        <div class="season-header">
          <h3 id="seasonTitle">Select Episode</h3>
          <button class="close-season" onclick="closeSeasonModal()">&times;</button>
        </div>
        <div class="season-grid" id="seasonGrid"></div>
      </div>
    </div>

    <!-- Watch History Section -->
    <section id="watchHistorySection" class="content-section" style="display:none;">
      <div class="section-header">
        <h2>Continue Watching</h2>
      </div>
      <div class="content-grid" id="watchHistoryGrid"></div>
    </section>

    <!-- Favorites Section -->
    <section id="favoritesSection" class="content-section" style="display:none;">
      <div class="section-header">
        <h2>My List</h2>
        <button class="clear-all" id="clearFavorites" onclick="clearFavorites()" style="display:none;">Clear All</button>
      </div>
      <div class="content-grid" id="favoritesGrid"></div>
    </section>

    <!-- Live Sports Channels -->
    <section id="sportsChannelsSection" class="sports-channels-section">
      <div class="section-header">
        <h2 class="section-title">Live Sports</h2>
      </div>
      <div id="liveSportsContainer" class="live-sports-container">
        <div class="live-sports-loading">Loading live matches...</div>
      </div>
      <!-- Inline live player -->
      <div id="livePlayerWrapper" class="live-player-wrapper" style="display:none;">
        <div class="live-player-header">
          <span id="livePlayerTitle" class="live-player-title"></span>
          <button class="live-player-close" onclick="closeLivePlayer()">✕</button>
        </div>
        <div class="live-sports-server-tabs" id="sportsServerTabs">
          <button class="sports-server-tab active" data-server="0" onclick="switchSportsServer(0)">EmbedSportex</button>
          <button class="sports-server-tab" data-server="1" onclick="switchSportsServer(1)">Sportsurge</button>
          <button class="sports-server-tab" data-server="2" onclick="switchSportsServer(2)">Footstar</button>
          <button class="sports-server-tab" data-server="3" onclick="switchSportsServer(3)">TopEmbed</button>
        </div>
        <div class="live-player-frame">
          <iframe id="livePlayerFrame" src="" frameborder="0" allowfullscreen allow="autoplay; encrypted-media"></iframe>
        </div>
      </div>
    </section>

    <!-- Featured Nepali Movie Banner -->
    <section id="nepaliFeaturedSection" class="nepali-featured-section">
      <div id="nepaliFeatured" class="nepali-featured-banner"></div>
    </section>

    <main id="main"></main>

    <div class="pagination">
      <div class="page" id="prev">Prev</div>
      <div class="page" id="current">1</div>
      <div class="page" id="next">Next</div>
    </div>

    <button
      onclick="topFunction()"
      id="topBtn"
      class="top-icon"
      title="Go to top"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="16"
        height="16"
        fill="currentColor"
        class="bi bi-chevron-double-up"
        viewBox="0 0 16 16"
      >
        <path
          fill-rule="evenodd"
          d="M7.646 2.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1-.708.708L8 3.707 2.354 9.354a.5.5 0 1 1-.708-.708l6-6z"
        />
        <path
          fill-rule="evenodd"
          d="M7.646 6.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1-.708.708L8 7.707l-5.646 5.647a.5.5 0 0 1-.708-.708l6-6z"
        />
      </svg>
    </button>

    <div class="footer">
      <div class="footer-content">
        <p class="contact-text">Contact Us</p>
        <div class="social-top">
          <div class="social">
           <div class="all">
            <span class="icon">
              <a href="https://github.com/" class="github">

                  xmlns="http://www.w3.org/2000/svg"

                  />
                </svg>
              </a>
            </span>
            <span class="icon">
              <a href="https://linkedin.com/" class="linkedin">

                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  fill="currentColor"
                  class="bi bi-linkedin"
                  viewBox="0 0 16 16"
                >

                  />
                </svg>
              </a>
            </span>
            <span class="icon">
              <a href="https://instagram.com/" class="instagram">
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="16"
                  height="16"
                  fill="currentColor"
                  class="bi bi-instagram"
                  viewBox="0 0 16 16"
                >

                    d="M8 0C5.829 0 5.556.01 4.703.048 3.85.088 3.269.222 2.76.42a3.917 3.917 0 0 0-1.417.923A3.927 3.927 0 0 0 .42 2.76C.222 3.268.087 3.85.048 4.7.01 5.555 0 5.827 0 8.001c0 2.172.01 2.444.048 3.297.04.852.174 1.433.372 1.942.205.526.478.972.923 1.417.444.445.89.719 1.416.923.51.198 1.09.333 1.942.372C5.555 15.99 5.827 16 8 16s2.444-.01 3.298-.048c.851-.04 1.434-.174 1.943-.372a3.916 3.916 0 0 0 1.416-.923c.445-.445.718-.891.923-1.417.197-.509.332-1.09.372-1.942C15.99 10.445 16 10.173 16 8s-.01-2.445-.048-3.299c-.04-.851-.175-1.433-.372-1.941a3.926 3.926 0 0 0-.923-1.417A3.911 3.911 0 0 0 13.24.42c-.51-.198-1.092-.333-1.943-.372C10.443.01 10.172 0 7.998 0h.003zm-.717 1.442h.718c2.136 0 2.389.007 3.232.046.78.035 1.204.166 1.486.275.373.145.64.319.92.599.28.28.453.546.598.92.11.281.24.705.275 1.485.039.843.047 1.096.047 3.231s-.008 2.389-.047 3.232c-.035.78-.166 1.203-.275 1.485a2.47 2.47 0 0 1-.599.919c-.28.28-.546.453-.92.598-.28.11-.704.24-1.485.276-.843.038-1.096.047-3.232.047s-2.39-.009-3.233-.047c-.78-.036-1.203-.166-1.485-.276a2.478 2.478 0 0 1-.92-.598 2.48 2.48 0 0 1-.6-.92c-.109-.281-.24-.705-.275-1.485-.038-.843-.046-1.096-.046-3.233 0-2.136.008-2.388.046-3.231.036-.78.166-1.204.276-1.486.145-.373.319-.64.599-.92.28-.28.546-.453.92-.598.282-.11.705-.24 1.485-.276.738-.034 1.024-.044 2.515-.045v.002zm4.988 1.328a.96.96 0 1 0 0 1.92.96.96 0 0 0 0-1.92zm-4.27 1.122a4.109 4.109 0 1 0 0 8.217 4.109 4.109 0 0 0 0-8.217zm0 1.441a2.667 2.667 0 1 1 0 5.334 2.667 2.667 0 0 1 0-5.334z"
                  />
                </svg>
              </a>
            </span></div>
          </div>
        </div>

        <hr />
        <div class="copyright">
          <p class="copy">&copy; <span id="copyright-year"></span> pkview. All rights reserved.</p>
        </div>
      </div>
    </div>

    <script src="script_main.js"></script>
  </body>
</html>
